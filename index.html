<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSprint | Discover Movies, Trailers & Where to Watch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SEO Meta Tags for CineSprint -->
<meta name="description" content="Discover trending movies, watch official HD trailers, check ratings, and find legal streaming options on CineSprint.">
<meta name="keywords" content="movies, movie trailers, trending movies, where to watch, movie reviews, cine sprint">
<meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="uM-TGms7kFU4eSmtBLkZjLX6H49HaMKKKmfzdFCb7aE" />
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between items-center p-3 sm:p-6">

  <!-- Header & Navigation -->
  <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center gap-3 py-3 px-4 bg-slate-900 border border-slate-800 rounded-xl shadow-lg">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="CineSprint.loadCategory('trending')">
      <span class="text-2xl">🎬</span>
      <h1 class="text-xl font-black text-amber-400 tracking-wide">CineSprint</h1>
    </div>
    
    <!-- Search Bar -->
    <div class="w-full sm:w-auto flex-1 max-w-md">
      <input type="text" id="searchInput" onkeyup="CineSprint.handleSearch(event)" placeholder="Search movies, actors, genres..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-amber-400">
    </div>

    <!-- Quick Navigation -->
    <div class="flex gap-2 text-xs">
      <button onclick="CineSprint.loadCategory('trending')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer">🔥 Trending</button>
      <button onclick="CineSprint.loadCategory('top_rated')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer">⭐ Top Rated</button>
    </div>
  </header>

  <!-- Main App Content -->
  <main class="w-full max-w-4xl my-4 space-y-4">

    <!-- Top Adsterra Banner Slot (320x50 Mobile Banner) -->
    <div class="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl flex justify-center items-center overflow-hidden min-h-[60px]">
      <script>
        atOptions = {
          'key' : '6616e6fa152d4293f7a269717be807',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//www.highperformanceformat.com/6616e6fa152d4293f7a269717be807/invoke.js"></script>
    </div>

    <!-- Category Header -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h2 id="sectionTitle" class="text-base sm:text-lg font-black text-white uppercase tracking-wide">🔥 Trending Now</h2>
      <span id="movieCount" class="text-xs text-slate-400 font-medium">Fetching movies...</span>
    </div>

    <!-- Movie Cards Grid -->
    <section id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-8 text-slate-400">Loading catalog...</div>
    </section>

    <!-- Mid-Page Adsterra Banner Slot (300x250) -->
    <div class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-center items-center overflow-hidden min-h-[260px]">
      <script>
        atOptions = {
          'key' : '280f31319941f74b6f4afa3871f8af01',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//www.highperformanceformat.com/280f31319941f74b6f4afa3871f8af01/invoke.js"></script>
    </div>

    <!-- Native Banner Ad Slot -->
    <div class="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl flex flex-col justify-center items-center overflow-hidden">
      <script async="async" data-cfasync="false" src="https://bicea.org/21/a3dae65368808837bfc1f0e109ec8f47"></script>
      <div id="container-a3dae65368808837bfc1f0e109ec8f47"></div>
    </div>

  </main>

  <!-- Movie Details & Trailer Modal -->
  <div id="movieModal" onclick="CineSprint.handleBackdropClick(event)" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl relative">
      
      <!-- Fixed Header Bar with Clear Close Button -->
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 shrink-0">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Movie Details & Trailer</h3>
        <button onclick="CineSprint.closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 transition cursor-pointer">
          ✕ Close
        </button>
      </div>

      <!-- Scrollable Content Area -->
      <div id="modalContent" class="overflow-y-auto space-y-4 pt-3 flex-1">
        <!-- Dynamic Content Injected Here -->
      </div>

    </div>
  </div>

  <script>
    const TMDB_API_KEY = "8ad7c0e976db14c6ba856667d205e769";
    const TMDB_BASE_URL = "https://api.themoviedb.org/3";
    const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

    const CineSprint = {
      searchDebounce: null,

      init: function() {
        this.loadCategory('trending');
      },

      loadCategory: async function(type) {
        const grid = document.getElementById("movieGrid");
        const title = document.getElementById("sectionTitle");
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">Fetching titles...</div>`;

        let url = "";
        if (type === 'trending') {
          title.innerText = "🔥 Trending Now";
          url = `${TMDB_BASE_URL}/trending/movie/week?api_key=${TMDB_API_KEY}`;
        } else if (type === 'top_rated') {
          title.innerText = "⭐ Top Rated Classics";
          url = `${TMDB_BASE_URL}/movie/top_rated?api_key=${TMDB_API_KEY}`;
        }

        this.fetchAndRenderMovies(url);
      },

      handleSearch: function(e) {
        clearTimeout(this.searchDebounce);
        const query = e.target.value.trim();

        if (query.length < 2) {
          if (query.length === 0) this.loadCategory('trending');
          return;
        }

        this.searchDebounce = setTimeout(() => {
          document.getElementById("sectionTitle").innerText = `🔍 Search Results: "${query}"`;
          const url = `${TMDB_BASE_URL}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
          this.fetchAndRenderMovies(url);
        }, 400);
      },

      fetchAndRenderMovies: async function(url) {
        const grid = document.getElementById("movieGrid");
        const count = document.getElementById("movieCount");

        try {
          const res = await fetch(url);
          const data = await res.json();
          const movies = data.results || [];

          count.innerText = `${movies.length} Movies Available`;

          if (movies.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">No movies found matching your search.</div>`;
            return;
          }

          grid.innerHTML = movies.map(m => {
            const poster = m.poster_path ? `${IMAGE_BASE_URL}${m.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
            const rating = m.vote_average ? m.vote_average.toFixed(1) : 'N/A';
            const year = m.release_date ? m.release_date.split('-')[0] : 'TBA';

            return `
              <div onclick="CineSprint.openMovieModal(${m.id})" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg hover:border-amber-500/50 hover:scale-[1.02] transition cursor-pointer flex flex-col justify-between">
                <img src="${poster}" alt="${m.title}" class="w-full h-56 sm:h-64 object-cover">
                <div class="p-3 space-y-1">
                  <div class="flex justify-between items-center text-[11px] text-slate-400">
                    <span>📅 ${year}</span>
                    <span class="text-amber-400 font-bold">⭐ ${rating}</span>
                  </div>
                  <h3 class="text-xs font-bold text-white line-clamp-1">${m.title}</h3>
                </div>
              </div>
            `;
          }).join('');
        } catch(e) {
          grid.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">Error loading movie feed. Please refresh.</div>`;
        }
      },

      openMovieModal: async function(movieId) {
        const modal = document.getElementById("movieModal");
        const container = document.getElementById("modalContent");
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        container.innerHTML = `<div class="text-center py-8 text-slate-400">Loading details & official trailers...</div>`;

        try {
          const res = await fetch(`${TMDB_BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}&append_to_response=videos`);
          const m = await res.json();

          const videos = m.videos ? m.videos.results : [];
          const trailer = videos.find(v => v.type === "Trailer" && v.site === "YouTube") || videos[0];
          const backdrop = m.backdrop_path ? `${IMAGE_BASE_URL}${m.backdrop_path}` : '';
          const rating = m.vote_average ? m.vote_average.toFixed(1) : 'N/A';
          const runtime = m.runtime ? `${m.runtime} mins` : 'N/A';

          container.innerHTML = `
            <div class="space-y-4">
              ${backdrop ? `<img src="${backdrop}" class="w-full h-44 object-cover rounded-lg border border-slate-800">` : ''}
              
              <div>
                <h2 class="text-lg font-black text-white">${m.title} <span class="text-xs text-slate-400 font-normal">(${m.release_date ? m.release_date.split('-')[0] : ''})</span></h2>
                <div class="flex gap-3 text-xs text-slate-400 mt-1">
                  <span>⭐ <strong class="text-amber-400">${rating}</strong>/10</span>
                  <span>⏱️ ${runtime}</span>
                  <span>🎭 ${m.genres ? m.genres.map(g => g.name).join(', ') : 'N/A'}</span>
                </div>
              </div>

              <p class="text-xs text-slate-300 leading-relaxed max-h-28 overflow-y-auto">${m.overview || 'No synopsis available.'}</p>

              <!-- Video Player Container -->
              <div class="space-y-2">
                <h4 class="text-xs font-bold uppercase text-slate-400">Official Trailer</h4>
                ${trailer ? `
                  <div class="aspect-video w-full rounded-lg overflow-hidden border border-slate-800">
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${trailer.key}" frameborder="0" allowfullscreen></iframe>
                  </div>
                ` : `<p class="text-xs text-slate-500 italic">No official trailer video linked.</p>`}
              </div>

              <!-- Legal Streaming Search Links -->
              <div class="bg-slate-950 p-3 rounded-lg border border-slate-800/80 flex flex-col sm:flex-row justify-between items-center gap-2">
                <span class="text-xs text-slate-400">Find on Legal Streaming Services:</span>
                <div class="flex gap-2">
                  <a href="https://www.google.com/search?q=watch+${encodeURIComponent(m.title)}+online" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded text-xs transition">
                    ▶️ Where to Watch
                  </a>
                </div>
              </div>
            </div>
          `;
        } catch(e) {
          container.innerHTML = `<div class="text-center py-6 text-red-400">Failed to load movie details.</div>`;
        }
      },

      closeModal: function() {
        document.getElementById("movieModal").classList.add("hidden");
        document.getElementById("modalContent").innerHTML = "";
        document.body.style.overflow = "auto";
      },

      handleBackdropClick: function(e) {
        if (e.target.id === "movieModal") {
          this.closeModal();
        }
      }
    };

    window.addEventListener("DOMContentLoaded", () => CineSprint.init());
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") CineSprint.closeModal();
    });
  </script>
</body>
</html>
